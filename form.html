<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form  Tag</title>
</head>
<body>
    <form method="get" action="#">
        <fieldset>
            <legend align="center">Signup Form</legend>
            <label for="fn">First Name:</label>
            <input type="text" id="fn" name="fn" required placeholder="Enter your First name" minlength="3" maxlength="15" value="Student" autofocus><br><br>
            <label for="ln">Last Name:</label>
            <input type="text" id="ln" name="ln" required placeholder="Enter your Last name" minlength="3" maxlength="15" > <br><br>
            Password:<input  type="password" pattern="[A-Za-z]*[0-9]+[A-Za-z]*" required placeholder="Enter your password" title="Password must contain at least one number and only letters and numbers" > <br><br>
            Email:<input type="email">
            Mobile No:<input type="tel"><br><br>
            Address:<textarea placeholder="Enter your Adress" rows="10" cols="5"></textarea>
            City:<select>
                <option hidden selected disabled>----Select City----</option>
                <optgroup label="Gujarat">
                    <option>Ahmedabad</option>
                    <option>Surat</option>
                    <option> Vadodara</option>
                </optgroup>
                <optgroup label="Maharashtra">
                    <option>Mumbai</option>
                    <option>Pune</option>
                    <option>Nashik</option>
                </optgroup>

            </select>
            Gender:<input type="radio" name="g" checked>Male
            <input type="radio" name="g">Female<br><br>
            Hobbies:<br><input type="checkbox" checked>AI<br>
            <input type="checkbox">Dancing<br>
            <input type="checkbox">Singing<br>
            Fav color:<input type="color">
        </fieldset>
        <fieldset>
            <legend align="center">Proffesional Information</legend>
            CGPA:<input type="number" min="7.0" max="10.0" step="3">
            Salary Range:2 LPA &nbsp;
            <input type="range" min="2" max="15" value="2" step="5">15 LPA<br><br>
            Resume:<input type="file" multiple accept=".jpg,.png,.html">
            Date of Joining:<input type="date" min="2026-09-22" max="2026-12-01">
            Fav Subject:
            <input  type="text" list="mylist">
            <datalist id="mylist" name="mylist">
                <option > FSD-1</option>
                <option >Python-1</option>
                <option >PS</option>
                <option >DE</option>
                
            </datalist>
        </fieldset>
        <input type="Submit" value="Register">
        <button type="reset">Reset  </button>
        <input  type="button" value="Click me">
    </form>
    
</body>
</html>
